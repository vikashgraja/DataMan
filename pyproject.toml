[project]
name = "dataman"
version = "0.1.0"
description = "A dynamic, headless data layer framework built on Django and DRF for instant CRUD APIs and custom business logic."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Vikash G", email = "vikashgraja@gmail.com" }
]
requires-python = ">=3.13"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.0",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
keywords = ["django", "rest", "api", "crud", "headless", "generator", "scaffold"]


dependencies = [
    "django>=6.0.2",
    "djangorestframework>=3.15.0",
    "click>=8.1.7",
    "python-dotenv>=1.0.1",
    "django-filter>=25.1",
    "requests>=2.32.3",
    "pydantic>=2.10.5",
    "drf-spectacular>=0.28.0",
    "dj-database-url>=2.3.0",
    "inflection>=0.5.1",
    "uvicorn>=0.34.0",
    "cryptography>=42.0.0",
]

[project.scripts]
dataman = "dataman.cli:cli"

[project.urls]
Homepage = "https://github.com/vikashg/dataman"
Repository = "https://github.com/vikashg/dataman.git"

[tool.coverage.run]
branch = true
concurrency = ["multiprocessing"]
sigterm = true
[build-system]
requires = ["uv_build>=0.10.6,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.1",
]

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = [".venv", "venv", "__pycache__", "build", "dist"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "C4",
    "SIM",
]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
